[versions]
agp             = "9.3.1"
kotlin          = "2.4.10"
ksp             = "2.3.11"
compose-bom     = "2026.08.00"
room            = "2.8.4"
workmanager     = "2.11.2"
navigation      = "2.9.8"
lifecycle       = "2.11.0"
okhttp          = "5.5.0"
coil            = "2.7.0"
coroutines      = "1.11.0"
datastore       = "1.2.1"
splashscreen    = "1.0.1"
vico            = "3.3.0-next.2"
aboutlibraries  = "15.0.4"
junit           = "4.13.2"
kotlinter       = "5.7.0"

[libraries]
# Compose
compose-bom                  = { group = "androidx.compose",         name = "compose-bom",                   version.ref = "compose-bom" }
compose-ui                   = { group = "androidx.compose.ui",      name = "ui" }
compose-ui-graphics          = { group = "androidx.compose.ui",      name = "ui-graphics" }
compose-ui-tooling           = { group = "androidx.compose.ui",      name = "ui-tooling" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui",      name = "ui-tooling-preview" }
compose-material3            = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons       = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-activity             = { group = "androidx.activity",         name = "activity-compose",              version = "1.13.0" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Room
room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler",  version.ref = "room" }

# WorkManager
workmanager = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }

# Lifecycle
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }

# Networking
okhttp         = { group = "com.squareup.okhttp3", name = "okhttp",               version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor",  version.ref = "okhttp" }

# Images
coil = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# DataStore (substitui SharedPreferences para preferências de tema)
datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Splash screen nativa (tela de primeiro acesso)
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# Charts
vico-compose = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }

# Open source licenses list (Sobre > Licenças)
aboutlibraries = { group = "com.mikepenz", name = "aboutlibraries-compose-m3", version.ref = "aboutlibraries" }

# Shimmer
shimmer = { group = "com.valentinilk.shimmer", name = "compose-shimmer", version = "1.5.0" }

# ML Kit Translation
mlkit-translate = { group = "com.google.mlkit", name = "translate", version = "17.0.3" }

# JSON
gson = { group = "com.google.code.gson", name = "gson", version = "2.14.0" }

# Coroutines
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.8.0" }

# Testes
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application",                version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",           version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",    version.ref = "kotlin" }
kotlin-parcelize    = { id = "org.jetbrains.kotlin.plugin.parcelize" }
ksp                 = { id = "com.google.devtools.ksp",                version.ref = "ksp" }
kotlinter           = { id = "org.jmailen.kotlinter",                  version.ref = "kotlinter" }
aboutlibraries         = { id = "com.mikepenz.aboutlibraries.plugin",         version.ref = "aboutlibraries" }
aboutlibraries-android = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutlibraries" }
