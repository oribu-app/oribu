org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.daemon=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# AGP 9 makes Kotlin support built-in and switches to a new DSL by default, both
# of which reject the explicitly-applied org.jetbrains.kotlin.android plugin this
# project still uses. Opting out of both for now to unblock the AGP 9 bump without
# also migrating the Kotlin/Compose/Parcelize plugin wiring in the same pass —
# revisit as its own task (see https://kotl.in/gradle/agp-built-in-kotlin and
# https://kotl.in/gradle/agp-new-dsl).
android.builtInKotlin=false
android.newDsl=false
