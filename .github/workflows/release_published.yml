name: Notify website of published release

# Stable/beta releases are created as drafts by build_push.yml, so they only really
# "go out" once a maintainer publishes the draft on GitHub. That publish action fires
# this event, which we use to trigger a rebuild of the download page.
#
# Requires a WEBSITE_DISPATCH_TOKEN secret (a PAT with contents:write on
# oribu-app/oribu-app.github.io) to be configured on this repo before this works.
on:
  release:
    types: [published]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Notify website
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          repository: oribu-app/oribu-app.github.io
          event-type: app_release
          client-payload: '{"tag": "${{ github.event.release.tag_name }}"}'
