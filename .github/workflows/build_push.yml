name: Build app

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Build and Release v{0}', github.event.inputs.version) || github.event.head_commit.message }}

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without "v" prefix, e.g. 1.0.0)'
        required: true
        type: string
      beta:
        description: "Beta release"
        default: false
        required: false
        type: boolean
      message:
        description: "Message for releases (the text at the top of changelog)"
        default: ""
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install compileSdk build-tools
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Set up CHANGELOG parser
        uses: taiki-e/install-action@3bd7951a304501f68fb5646096d4dbabf32d728c # parse-changelog

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Get changelog
        id: changelog
        shell: bash
        run: |
          # extended SemVer (major.minor.patch)
          VERSION_FORMAT='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z\.-]+)?(\+[0-9A-Za-z\.-]+)?$|^Unreleased$'
          {
            echo "CHANGELOG<<END_OF_FILE"
            parse-changelog CHANGELOG.md ${{ github.event.inputs.version == '' && 'Unreleased' || github.event.inputs.version }} --version-format "$VERSION_FORMAT" || parse-changelog CHANGELOG.md Unreleased --version-format "$VERSION_FORMAT" || echo "No documented changes so far..."
            echo ""
            echo "END_OF_FILE"
          } >> "$GITHUB_OUTPUT" 2> /dev/null

      # STABLE
      - name: Prepare release build
        if: github.event.inputs.version != '' && github.event.inputs.beta != 'true'
        run: |
          echo "VERSION_TAG=v${{ github.event.inputs.version }}" >> $GITHUB_ENV
          echo "BUILD_TYPE=Release" >> $GITHUB_ENV
          echo "STAGE=release" >> $GITHUB_ENV

      # BETA
      - name: Prepare beta build
        if: github.event.inputs.version != '' && github.event.inputs.beta == 'true'
        run: |
          BETA_COUNT=$(git tag -l --sort=refname "v${{ github.event.inputs.version }}-b*" | tail -n1 | sed "s/^\S*-b//g")
          if [ -z "$BETA_COUNT" ]; then
            BETA_COUNT="1"
          else
            BETA_COUNT=$((BETA_COUNT+1))
          fi
          echo "VERSION_TAG=v${{ github.event.inputs.version }}-b${BETA_COUNT}" >> $GITHUB_ENV
          echo "BUILD_TYPE=Beta" >> $GITHUB_ENV
          echo "STAGE=beta" >> $GITHUB_ENV

      # NIGHTLY
      - name: Prepare nightly build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          echo "VERSION_TAG=r$(git rev-list --count HEAD)" >> $GITHUB_ENV
          echo "BUILD_TYPE=Nightly" >> $GITHUB_ENV
          echo "STAGE=nightly" >> $GITHUB_ENV
          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "COMMIT_SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build the app
        run: ./gradlew assemble${{ env.BUILD_TYPE }}

      # AGP 9's variant task generation only creates a unit test task for the
      # "debug" build type by default now — testReleaseUnitTest and friends
      # no longer exist, so this is the only unit test task available.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Publish test report
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5
        if: success() || failure()
        with:
          include_passed: true
          detailed_summary: true
          report_paths: "**/build/test-results/test*/TEST-*.xml"

      # A nightly já sai assinada com a keystore de debug (signingConfig definido no
      # build.gradle.kts) — não precisa de secrets. Beta/Release saem unsigned do Gradle
      # de propósito e são assinadas aqui com a keystore de release real, uma vez por
      # variante de ABI (universal + arm64-v8a + armeabi-v7a + x86 + x86_64).
      - name: Sign APK (beta/release)
        if: env.STAGE == 'beta' || env.STAGE == 'release'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Secrets de assinatura (SIGNING_KEY/ALIAS/KEY_STORE_PASSWORD/KEY_PASSWORD) não configurados no repositório. Configure-os em Settings > Secrets and variables > Actions antes de disparar uma release ${{ env.STAGE }}."
            exit 1
          fi

          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          APK_DIR="app/build/outputs/apk/${{ env.STAGE }}"

          echo "$SIGNING_KEY" | base64 -d > release.keystore

          for variant in universal arm64-v8a armeabi-v7a x86 x86_64; do
            UNSIGNED_APK="$APK_DIR/app-${variant}-${{ env.STAGE }}-unsigned.apk"
            "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$APK_DIR/app-${variant}-${{ env.STAGE }}-aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$KEY_STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$APK_DIR/app-${variant}-${{ env.STAGE }}-signed.apk" \
              "$APK_DIR/app-${variant}-${{ env.STAGE }}-aligned.apk"
          done

          rm release.keystore

      - name: Clean up build artifacts
        if: env.VERSION_TAG != ''
        run: |
          set -e

          case "${{ env.STAGE }}" in
            nightly) dir="app/build/outputs/apk/nightly"; suffix="nightly" ;;
            *)       dir="app/build/outputs/apk/${{ env.STAGE }}"; suffix="${{ env.STAGE }}-signed" ;;
          esac

          mv "$dir/app-universal-${suffix}.apk" "oribu-${{ env.VERSION_TAG }}.apk"
          sha=`sha256sum oribu-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_UNIVERSAL_SHA=$sha" >> $GITHUB_ENV

          cp "$dir/app-arm64-v8a-${suffix}.apk" "oribu-arm64-v8a-${{ env.VERSION_TAG }}.apk"
          sha=`sha256sum oribu-arm64-v8a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_ARM64_V8A_SHA=$sha" >> $GITHUB_ENV

          cp "$dir/app-armeabi-v7a-${suffix}.apk" "oribu-armeabi-v7a-${{ env.VERSION_TAG }}.apk"
          sha=`sha256sum oribu-armeabi-v7a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_ARMEABI_V7A_SHA=$sha" >> $GITHUB_ENV

          cp "$dir/app-x86-${suffix}.apk" "oribu-x86-${{ env.VERSION_TAG }}.apk"
          sha=`sha256sum oribu-x86-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_X86_SHA=$sha" >> $GITHUB_ENV

          cp "$dir/app-x86_64-${suffix}.apk" "oribu-x86_64-${{ env.VERSION_TAG }}.apk"
          sha=`sha256sum oribu-x86_64-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_X86_64_SHA=$sha" >> $GITHUB_ENV

      - name: Upload R8 APK to artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.VERSION_TAG != ''
        with:
          name: arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/*/app*-arm64-v8a-*.apk

      - name: Upload R8 mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.VERSION_TAG != ''
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/*

      # Nightlies are published to the separate oribu-app/oribu-nightly repo (see "Create
      # Nightly" below), so no tag is created here - action-gh-release creates the tag
      # directly in the target repo, and it doesn't need to point at a real commit there.
      - name: Create and push tag
        if: env.STAGE == 'release' || env.STAGE == 'beta'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ env.VERSION_TAG }}"
          git push origin "${{ env.VERSION_TAG }}"

      - name: Create Release
        if: env.STAGE == 'release' || env.STAGE == 'beta'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Oribu ${{ env.VERSION_TAG }}
          body: |
            ${{ github.event.inputs.message }}

            ${{ steps.changelog.outputs.CHANGELOG }}
            ---

            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ env.APK_UNIVERSAL_SHA }} |
            | arm64-v8a | ${{ env.APK_ARM64_V8A_SHA }} |
            | armeabi-v7a | ${{ env.APK_ARMEABI_V7A_SHA }} |
            | x86 | ${{ env.APK_X86_SHA }} |
            | x86_64 | ${{ env.APK_X86_64_SHA }} |

            > [!TIP]
            >
            > If you are unsure which version to download then go with **oribu-${{ env.VERSION_TAG }}.apk**
          files: |
            oribu-${{ env.VERSION_TAG }}.apk
            oribu-arm64-v8a-${{ env.VERSION_TAG }}.apk
            oribu-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            oribu-x86-${{ env.VERSION_TAG }}.apk
            oribu-x86_64-${{ env.VERSION_TAG }}.apk
          draft: true
          prerelease: ${{ github.event.inputs.beta }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Published straight to oribu-app/oribu-nightly, not this repo - keeps this repo's
      # release list limited to stable/beta so it stays clean once the website links to it.
      - name: Create Nightly
        if: env.STAGE == 'nightly'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ secrets.NIGHTLY_PAT }}
          repository: oribu-app/oribu-nightly
          tag_name: ${{ env.VERSION_TAG }}
          name: Oribu Nightly (${{ env.VERSION_TAG }})
          body: |
            > [!CAUTION]
            > _**This build is for testing only!**_
            >
            > This build is triggered by commit [`${{ env.COMMIT_SHORT_HASH }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ env.COMMIT_HASH }})

            It is not recommended for daily use. Please download the latest stable release instead (${{ github.server_url }}/${{ github.repository }}/releases/latest).

            ${{ steps.changelog.outputs.CHANGELOG }}
            ---

            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ env.APK_UNIVERSAL_SHA }} |
            | arm64-v8a | ${{ env.APK_ARM64_V8A_SHA }} |
            | armeabi-v7a | ${{ env.APK_ARMEABI_V7A_SHA }} |
            | x86 | ${{ env.APK_X86_SHA }} |
            | x86_64 | ${{ env.APK_X86_64_SHA }} |

            > [!TIP]
            >
            > If you are unsure which version to download then go with **oribu-${{ env.VERSION_TAG }}.apk**
          files: |
            oribu-${{ env.VERSION_TAG }}.apk
            oribu-arm64-v8a-${{ env.VERSION_TAG }}.apk
            oribu-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            oribu-x86-${{ env.VERSION_TAG }}.apk
            oribu-x86_64-${{ env.VERSION_TAG }}.apk
          draft: false
          prerelease: true

      # Nightly releases are published immediately (not drafts), so the site can be
      # rebuilt right away. Stable/beta releases are drafts and are dispatched
      # separately from release_published.yml when a maintainer actually publishes them.
      - name: Notify website of new nightly
        if: env.STAGE == 'nightly'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          repository: oribu-app/oribu-app.github.io
          event-type: app_release
          client-payload: '{"tag": "${{ env.VERSION_TAG }}", "stage": "nightly"}'
